name: Feature proposal
description: Propose a focused improvement to the open-source Radius runtime.
title: "[Proposal]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or agent-developer problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security and compatibility considerations
      description: Note affected permissions, protocols, data, or platform support.
    validations:
      required: true
