name: Desktop packaging

on:
  pull_request:
    paths:
      - apps/desktop/package.json
      - apps/desktop/electron-builder.*
      - bun.lock
      - package.json
      - bunfig.toml
      - scripts/verify-electron-packaging.ts
      - .github/workflows/desktop-packaging.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows installer packaging
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install packaging dependencies
        run: bun install --frozen-lockfile --ignore-scripts --filter @curve-ai/radius-desktop
      - name: Build, install and launch NSIS payloads
        run: bun scripts/verify-electron-packaging.ts
