name: Desktop release

# Builds the desktop app on every supported platform and attaches it to a
# draft GitHub release, together with radius-desktop.json, which the radius CLI
# reads to install the app on first `radius dev`.
#
# The Desktop release cut workflow picks the version, tags it and calls this
# one. Pushing a desktop-v<version> tag whose version matches
# apps/desktop/package.json also works. The release stays a draft until someone publishes it, and the auto-updater
# and the CLI see nothing until then. Run it manually with dry-run to build
# every platform and keep the results as workflow artifacts only.
#
# Signing switches on per platform when its secrets exist; without them the
# same jobs produce unsigned builds. See CONTRIBUTING.md for the secret names.

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and keep workflow artifacts, but publish nothing
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        description: The desktop-v* tag to build and release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.4"
  NODE_VERSION: "22.23.4"
  RUST_VERSION: "1.94.0"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A caller's own ref is main; the release is built from its tag.
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install manifest dependencies
        run: bun install --frozen-lockfile --ignore-scripts --filter @curve-ai/radius-runtime
      - name: Test the manifest generator
        run: bun test apps/desktop/scripts/release-manifest.test.ts
      - name: Check the tag against the app version
        id: version
        env:
          DRY_RUN: ${{ inputs.dry-run == true }}
          CALLED_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(jq -er .version apps/desktop/package.json)
          tag="desktop-v$version"
          built_from="$REF_TYPE $REF_NAME"
          [ -n "$CALLED_TAG" ] && built_from="tag $CALLED_TAG"
          publish=true
          if [ "$DRY_RUN" = "true" ]; then
            publish=false
          elif [ "$built_from" != "tag $tag" ]; then
            # The updater and the CLI trust the tag to name the version inside.
            echo "Publishing needs the tag $tag; this run is on $built_from." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  macos-arm64:
    name: Build (macOS arm64)
    needs: prepare
    # The runtime host links Apple Containerization, which needs Apple Silicon
    # and the macOS 26 SDK. There is no Intel macOS build for the same reason:
    # the host neither builds nor runs there.
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Record whether this build is signed
        id: signing
        run: echo "signed=${{ env.MACOS_CERTIFICATE_P12 != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A caller's own ref is main; the release is built from its tag.
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # CI saves this cache on main with the same key and paths, and a release
      # run can read main's caches, so packages and the Electron and
      # electron-builder downloads are rarely fetched again.
      - name: Restore dependency downloads
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/bun-install-cache
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: ${{ runner.os }}-${{ runner.arch }}-dependencies-bun${{ env.BUN_VERSION }}-node${{ env.NODE_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-dependencies-bun${{ env.BUN_VERSION }}-node${{ env.NODE_VERSION }}-
      - name: Install dependencies
        run: |
          {
            echo "BUN_INSTALL_CACHE_DIR=${{ runner.temp }}/bun-install-cache"
            echo "electron_config_cache=${{ runner.temp }}/electron-cache"
            echo "ELECTRON_BUILDER_CACHE=${{ runner.temp }}/electron-builder-cache"
          } >> "$GITHUB_ENV"
          export BUN_INSTALL_CACHE_DIR="${{ runner.temp }}/bun-install-cache"
          export electron_config_cache="${{ runner.temp }}/electron-cache"
          # One failed download should not fail a long release build.
          for attempt in 1 2 3; do
            bun ci && exit 0
            echo "bun ci failed (attempt $attempt); retrying" >&2
            sleep 20
          done
          exit 1

      - name: Import the Developer ID certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/radius-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "The certificate holds no Developer ID Application identity." >&2
            exit 1
          fi
          echo "RADIUS_RUNTIME_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Write the notarization key
        if: env.MACOS_CERTIFICATE_P12 != ''
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          # Notarizing an unsigned app fails, so the key is only written for a
          # signed build. electron-builder notarizes when APPLE_API_KEY names it.
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notarization.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/notarization.p8" >> "$GITHUB_ENV"
          fi

      - name: Identify the Swift toolchain
        id: swift
        run: echo "version=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # Compiling Containerization's 29 packages, two copies of BoringSSL
      # among them, is most of this job. The build folder keeps them between
      # runs, so only Radius's own sources rebuild. It also keeps the verified
      # kernel archive. A new toolchain or dependency set starts clean.
      - name: Restore the runtime host build
        id: runtime-host-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: apps/runtime-host-macos/.build
          key: runtime-host-macos-${{ steps.swift.outputs.version }}-${{ hashFiles('apps/runtime-host-macos/Package.swift', 'apps/runtime-host-macos/Package.resolved') }}-${{ hashFiles('apps/runtime-host-macos/Sources/**', 'apps/runtime-host-macos/Config/**') }}
          restore-keys: |
            runtime-host-macos-${{ steps.swift.outputs.version }}-${{ hashFiles('apps/runtime-host-macos/Package.swift', 'apps/runtime-host-macos/Package.resolved') }}-
      - name: Build the runtime host
        env:
          RADIUS_RUNTIME_ALLOW_UNSUPPORTED_HOST: "1"
        run: sh apps/runtime-host-macos/scripts/build.sh
      - name: Prepare the runtime kernel
        run: sh apps/runtime-host-macos/scripts/prepare-assets.sh
      # Caches written by a tag run are visible only to that tag, so this pays
      # off for runs on main: dry runs and release cuts.
      - name: Save the runtime host build
        if: steps.runtime-host-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: apps/runtime-host-macos/.build
          key: ${{ steps.runtime-host-cache.outputs.cache-primary-key }}
      - name: Prepare bundled agents
        run: bash apps/runtime-host-macos/scripts/prepare-agents.sh

      - name: Package the app
        env:
          NOTARIZATION_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARIZATION_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          args=(--mac dmg zip --arm64 --publish never)
          # electron-builder reads an empty CSC_LINK as a certificate path, so
          # the signing variables exist only when their secrets do.
          if [ -n "$MACOS_CERTIFICATE_P12" ]; then
            export CSC_LINK="$MACOS_CERTIFICATE_P12"
            export CSC_KEY_PASSWORD="$MACOS_CERTIFICATE_PASSWORD"
            if [ -n "${APPLE_API_KEY:-}" ]; then
              export APPLE_API_KEY_ID="$NOTARIZATION_KEY_ID"
              export APPLE_API_ISSUER="$NOTARIZATION_ISSUER"
            fi
          else
            # Without a certificate electron-builder skips signing, leaving a
            # broken bundle seal. Sign ad hoc instead; the hardened runtime is
            # off because its library validation rejects ad hoc frameworks.
            args+=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
          fi
          bun run --cwd apps/desktop make "${args[@]}"

      # electron-builder only warns when an extraResources source is missing.
      - name: Check the packaged runtime
        run: |
          set -euo pipefail
          resources=apps/desktop/dist/mac-arm64/Radius.app/Contents/Resources
          for file in runtime/macos-arm64/radius-runtime-host runtime/vmlinux-arm64 \
            runtime/runtime-assets.json agents/index.json; do
            test -s "$resources/$file" || { echo "Missing $file" >&2; exit 1; }
          done
          codesign -d --entitlements - --xml \
            "$resources/runtime/macos-arm64/radius-runtime-host" \
            | grep com.apple.security.virtualization >/dev/null
          codesign --verify --deep --strict apps/desktop/dist/mac-arm64/Radius.app

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos-arm64
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-mac.yml

  windows-x64:
    name: Build (Windows x64)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A caller's own ref is main; the release is built from its tag.
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set up Rust
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --target x86_64-unknown-linux-musl
          if ($LASTEXITCODE -ne 0) { throw 'rustup failed' }
          rustup default $env:RUST_VERSION
      # CI saves this cache on main with the same key and paths, and a release
      # run can read main's caches, so packages and the Electron and
      # electron-builder downloads are rarely fetched again.
      - name: Restore dependency downloads
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/bun-install-cache
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: ${{ runner.os }}-${{ runner.arch }}-dependencies-bun${{ env.BUN_VERSION }}-node${{ env.NODE_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-dependencies-bun${{ env.BUN_VERSION }}-node${{ env.NODE_VERSION }}-
      - name: Install dependencies
        run: |
          "BUN_INSTALL_CACHE_DIR=${{ runner.temp }}/bun-install-cache" >> $env:GITHUB_ENV
          "electron_config_cache=${{ runner.temp }}/electron-cache" >> $env:GITHUB_ENV
          "ELECTRON_BUILDER_CACHE=${{ runner.temp }}/electron-builder-cache" >> $env:GITHUB_ENV
          $env:BUN_INSTALL_CACHE_DIR = "${{ runner.temp }}/bun-install-cache"
          $env:electron_config_cache = "${{ runner.temp }}/electron-cache"
          # One failed download should not fail a long release build.
          foreach ($attempt in 1..3) {
            bun ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "bun ci failed (attempt $attempt); retrying"
            Start-Sleep -Seconds 20
          }
          exit 1

      - name: Read the pinned OpenVMM revision
        id: openvmm
        run: |
          $manifest = Get-Content apps/runtime-host-windows/Config/runtime-assets.json -Raw | ConvertFrom-Json
          "revision=$($manifest.openvmmRevision)" >> $env:GITHUB_OUTPUT
      # openvmm.exe takes most of an hour to build and changes only when the
      # pinned revision does.
      - name: Restore openvmm.exe
        id: openvmm-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/openvmm-bin
          key: openvmm-${{ steps.openvmm.outputs.revision }}-windows-x64
      - name: Build openvmm.exe at the pinned revision
        if: steps.openvmm-cache.outputs.cache-hit != 'true'
        env:
          OPENVMM_REVISION: ${{ steps.openvmm.outputs.revision }}
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'openvmm'
          git init $source
          # Keep the .git directory: openvmm --version reports the revision
          # from it, and the runtime host build checks that.
          git -C $source fetch --depth 1 https://github.com/microsoft/openvmm.git $env:OPENVMM_REVISION
          if ($LASTEXITCODE -ne 0) { throw 'fetching OpenVMM failed' }
          git -C $source checkout --detach FETCH_HEAD
          # OpenVMM states its own minimum Rust, which moves independently of
          # the toolchain this repository builds its runtime host with.
          $rust = (Select-String -Path (Join-Path $source 'Cargo.toml') -Pattern '^rust-version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if (-not $rust) { throw 'OpenVMM declares no rust-version' }
          rustup toolchain install $rust --profile minimal
          if ($LASTEXITCODE -ne 0) { throw "installing Rust $rust failed" }
          $env:RUSTUP_TOOLCHAIN = $rust
          Push-Location $source
          try {
            cargo xflowey restore-packages --no-compat-igvm
            if ($LASTEXITCODE -ne 0) { throw 'restoring OpenVMM packages failed' }
            cargo build --release -p openvmm
            if ($LASTEXITCODE -ne 0) { throw 'building openvmm failed' }
          } finally { Pop-Location }
          $bin = Join-Path $env:RUNNER_TEMP 'openvmm-bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Copy-Item (Join-Path $source 'target\release\openvmm.exe') $bin
      - name: Save openvmm.exe
        if: steps.openvmm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/openvmm-bin
          key: ${{ steps.openvmm-cache.outputs.cache-primary-key }}

      - name: Import the code signing certificate
        id: certificate
        if: env.WINDOWS_CERTIFICATE_PFX != ''
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT

      # As on macOS: keep compiled dependencies and the verified kernel, so
      # only Radius's own crates rebuild.
      - name: Restore the runtime host build
        id: runtime-host-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            apps/runtime-host-windows/.build
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: runtime-host-windows-${{ env.RUST_VERSION }}-${{ hashFiles('apps/runtime-host-windows/**/Cargo.lock') }}-${{ hashFiles('apps/runtime-host-windows/src/**', 'apps/runtime-host-windows/guest/**/src/**', 'apps/runtime-host-windows/Config/**') }}
          restore-keys: |
            runtime-host-windows-${{ env.RUST_VERSION }}-${{ hashFiles('apps/runtime-host-windows/**/Cargo.lock') }}-
      - name: Build the runtime host
        env:
          THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: |
          $arguments = @('-OpenVmmExe', (Join-Path $env:RUNNER_TEMP 'openvmm-bin\openvmm.exe'), '-AllowUnsupportedHost')
          if ($env:THUMBPRINT) { $arguments += @('-CertificateThumbprint', $env:THUMBPRINT) }
          & ./scripts/build-runtime-host-windows.ps1 @arguments
      - name: Prepare the runtime kernel
        run: ./scripts/prepare-runtime-assets-windows.ps1
      - name: Save the runtime host build
        if: steps.runtime-host-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            apps/runtime-host-windows/.build
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.runtime-host-cache.outputs.cache-primary-key }}
      - name: Prepare bundled agents
        run: ./scripts/prepare-bundled-agents-windows.ps1

      - name: Package the app
        run: |
          # electron-builder reads an empty WIN_CSC_LINK as a certificate path,
          # so the signing variables exist only when their secrets do.
          if ($env:WINDOWS_CERTIFICATE_PFX) {
            $env:WIN_CSC_LINK = $env:WINDOWS_CERTIFICATE_PFX
            $env:WIN_CSC_KEY_PASSWORD = $env:WINDOWS_CERTIFICATE_PASSWORD
          }
          bun run --cwd apps/desktop make --win nsis zip --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # electron-builder only warns when an extraResources source is missing.
      - name: Check the packaged runtime
        run: |
          $resources = 'apps/desktop/dist/win-unpacked/resources'
          foreach ($file in 'runtime/windows-x64/radius-runtime-host.exe', 'runtime/windows-x64/openvmm.exe',
                            'runtime/vmlinux-x64', 'runtime/runtime-assets.json', 'agents/index.json') {
            $path = Join-Path $resources $file
            if (-not (Test-Path $path) -or (Get-Item $path).Length -eq 0) { throw "Missing $file" }
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows-x64
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml

  linux-x64:
    name: Build (Linux x64)
    needs: prepare
    # Linux has no runtime host yet, so the app ships without bundled
    # agents there; development agents from `radius dev` still work. Only the
    # AppImage is built: the deb needs a maintainer email the project has not
    # chosen yet.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A caller's own ref is main; the release is built from its tag.
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # CI saves this cache on main with the same key and paths, and a release
      # run can read main's caches, so packages and the Electron and
      # electron-builder downloads are rarely fetched again.
      - name: Restore dependency downloads
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/bun-install-cache
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: ${{ runner.os }}-${{ runner.arch }}-dependencies-bun${{ env.BUN_VERSION }}-node${{ env.NODE_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-dependencies-bun${{ env.BUN_VERSION }}-node${{ env.NODE_VERSION }}-
      - name: Install dependencies
        run: |
          {
            echo "BUN_INSTALL_CACHE_DIR=${{ runner.temp }}/bun-install-cache"
            echo "electron_config_cache=${{ runner.temp }}/electron-cache"
            echo "ELECTRON_BUILDER_CACHE=${{ runner.temp }}/electron-builder-cache"
          } >> "$GITHUB_ENV"
          export BUN_INSTALL_CACHE_DIR="${{ runner.temp }}/bun-install-cache"
          export electron_config_cache="${{ runner.temp }}/electron-cache"
          # One failed download should not fail a long release build.
          for attempt in 1 2 3; do
            bun ci && exit 0
            echo "bun ci failed (attempt $attempt); retrying" >&2
            sleep 20
          done
          exit 1
      - name: Package the app
        run: bun run --cwd apps/desktop make --linux AppImage --x64 --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux-x64
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/latest-linux.yml

  release:
    name: Manifest and release
    needs: [prepare, macos-arm64, windows-x64, linux-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A caller's own ref is main; the release is built from its tag.
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install manifest dependencies
        run: bun install --frozen-lockfile --ignore-scripts --filter @curve-ai/radius-runtime
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - name: Write radius-desktop.json
        # The prepare job already proved the tag matches this version.
        run: |
          set -euo pipefail
          bun apps/desktop/scripts/release-manifest.ts \
            --artifacts release \
            --output release/radius-desktop.json \
            --repository "$GITHUB_REPOSITORY"
          ( cd release && sha256sum -- * > SHA256SUMS )
          {
            echo "### radius-desktop.json"
            echo
            echo '```json'
            cat release/radius-desktop.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          if-no-files-found: error
          path: |
            release/radius-desktop.json
            release/SHA256SUMS

      - name: Attach everything to a draft release
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MACOS_SIGNED: ${{ needs.macos-arm64.outputs.signed }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          echo "Radius desktop $VERSION." > "$notes"
          if [ "$MACOS_SIGNED" != "true" ]; then
            # Without a Developer ID (Team ID) signature, macOS ties keychain
            # access to each build, so every update asks again for the key
            # that protects local storage.
            cat >> "$notes" <<'NOTES'

          **macOS:** this build is not signed with an Apple Developer ID. On first
          launch after installing or updating, macOS asks for your login password
          so Radius can read its storage key from the keychain. Enter it and choose
          **Always Allow**. If you deny it, Radius cannot open its local storage.
          NOTES
          fi
          # A rerun replaces the files on the existing draft rather than
          # creating a second release.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag \
              --title "Radius $VERSION" \
              --notes-file "$notes"
          fi
          gh release upload "$TAG" release/* --clobber
