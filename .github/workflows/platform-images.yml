name: Publish Platform images

on:
  push:
    tags:
      - "platform-v*"

concurrency:
  group: platform-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: radius-platform-api
            dockerfile: apps/platform-api/Dockerfile
          - image: radius-platform-jobs
            dockerfile: apps/platform-jobs/Dockerfile
          - image: radius-platform-web
            dockerfile: apps/platform-web/Dockerfile
          - image: radius-postgres
            dockerfile: hosting/postgres/Containerfile

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#platform-v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a platform-vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Normalize package owner
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the multi-architecture image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.image }}:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the immutable image digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  release:
    name: Publish coherent Platform release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#platform-v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the published image set
        id: manifest
        env:
          OWNER: ${{ steps.version.outputs.owner }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          manifest="$(jq -n \
            --arg version "${VERSION}" \
            --arg revision "${GITHUB_SHA}" \
            --arg source "https://github.com/${GITHUB_REPOSITORY}" \
            '{schemaVersion: 1, version: $version, revision: $revision, source: $source, images: {}}')"
          for image in radius-platform-api radius-platform-jobs radius-platform-web radius-postgres; do
            reference="${REGISTRY}/${OWNER}/${image}:${VERSION}"
            digest="$(docker buildx imagetools inspect "${reference}" --format '{{json .Manifest}}' | jq -er '.digest')"
            manifest="$(jq \
              --arg image "${image}" \
              --arg reference "${REGISTRY}/${OWNER}/${image}@${digest}" \
              '.images[$image] = $reference' <<<"${manifest}")"
          done
          jq -S . <<<"${manifest}" > platform-images.json
          sha256sum platform-images.json > platform-images.json.sha256

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Radius Platform ${VERSION}

          This release contains one coherent, signed, multi-architecture image set
          for the Radius Platform Docker Compose distribution.
          Configure RADIUS_VERSION=${VERSION} in hosting/docker/.env.self-host.
          Verify every package is public before publishing this draft release.
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --draft \
            --title "Radius Platform ${VERSION}" \
            --notes-file release-notes.md \
            platform-images.json \
            platform-images.json.sha256
