name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.4"
  NODE_VERSION: "22.23.4"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  sync-database-changes:
    name: Detect sync database changes
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.changes.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Test database change detection
        run: bun test scripts/ci/sync-database-changes.test.ts
      - name: Detect affected inputs
        id: changes
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_DIFF_EVENT: ${{ github.event_name }}
        run: bun scripts/ci/sync-database-changes.ts

  sync-database:
    name: PostgreSQL sync verification
    needs: sync-database-changes
    # A skipped job reports success; detector
    # failures or missing outputs instead run the real database verification.
    if: ${{ !cancelled() && (needs.sync-database-changes.result != 'success' || needs.sync-database-changes.outputs.required != 'false') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_USER: radius
          POSTGRES_PASSWORD: radius-ci-only
          POSTGRES_DB: radius_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radius -d radius_sync_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install database verification dependencies
        run: bun install --frozen-lockfile --ignore-scripts --filter @curve-ai/radius-platform-api --filter @curve-ai/platform-database
      - name: Verify server-side sync behavior
        env:
          DATABASE_URL: postgresql://radius:radius-ci-only@127.0.0.1:5432/radius_sync_test
        run: bun run --cwd apps/platform-api verify:sync

  embedded-auth:
    name: Embedded auth (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_USER: radius
          POSTGRES_PASSWORD: radius-ci-only
          POSTGRES_DB: radius_development
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radius -d radius_development"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --filter @curve-ai/radius-platform-api
      - run: bun run --cwd apps/platform-api build:auth-ui
      - run: bun test apps/platform-api/auth-ui/authorization-state.test.ts
      - run: bun apps/platform-api/scripts/verify-embedded-auth.ts
        env:
          DATABASE_URL: postgresql://radius:radius-ci-only@127.0.0.1:5432/radius_development

  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Restore dependency downloads
        id: dependency-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/bun-install-cache
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: ${{ runner.os }}-${{ runner.arch }}-dependencies-bun${{ env.BUN_VERSION }}-node${{ env.NODE_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-dependencies-bun${{ env.BUN_VERSION }}-node${{ env.NODE_VERSION }}-

      - name: Install dependencies
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
          electron_config_cache: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
        run: bun ci

      - name: Check formatting of changed files
        if: runner.os == 'Linux'
        shell: bash
        env:
          FORMAT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bun fmt --changed="$FORMAT_BASE" --check

      - name: Save dependency downloads
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/bun-install-cache
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}

      - name: Restore Turbo tasks
        id: turbo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-v1-bun${{ env.BUN_VERSION }}-node${{ env.NODE_VERSION }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-v1-bun${{ env.BUN_VERSION }}-node${{ env.NODE_VERSION }}-

      - name: Verify workspace with Turbo
        id: verify
        run: bun run ci:verify

      - name: Save Turbo tasks
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.turbo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}

      - name: Test Python agent
        working-directory: examples/python-agent
        run: uv run --locked pytest

      - name: Lint Python agent
        working-directory: examples/python-agent
        run: uv run --locked ruff check .

      - name: Verify the Windows CLI image pipeline
        if: runner.os == 'Linux'
        run: |
          docker buildx create --name radius-windows-smoke --driver docker-container --use
          bun scripts/verify-windows-build.ts

      - name: Set up Windows Rust validation
        if: runner.os == 'Windows'
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy --component rustfmt --target x86_64-unknown-linux-musl

      - name: Build and check Windows guest programs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($guest in 'radius-vminit', 'radius-rootfs-builder') {
            Push-Location "apps/runtime-host-windows/guest/$guest"
            try {
              cargo +1.94.0 fmt --check
              if ($LASTEXITCODE -ne 0) { throw "Guest formatting failed: $guest" }
              cargo +1.94.0 clippy --locked --all-targets --all-features -- -D warnings
              if ($LASTEXITCODE -ne 0) { throw "Guest clippy failed: $guest" }
              cargo +1.94.0 build --locked --release
              if ($LASTEXITCODE -ne 0) { throw "Guest build failed: $guest" }
            } finally { Pop-Location }
          }

      - name: Validate native Windows runtime host
        if: runner.os == 'Windows'
        working-directory: apps/runtime-host-windows
        shell: pwsh
        run: |
          cargo +1.94.0 fmt --check
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime formatting failed' }
          cargo +1.94.0 clippy --locked --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime clippy failed' }
          cargo +1.94.0 test --locked
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime tests failed' }

      - name: Audit dependencies at all severities
        if: runner.os == 'Linux'
        run: bun audit --audit-level low
