name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Install dependencies
        run: bun ci

      - name: Type-check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run --cwd apps/desktop build:bundle

      - name: Verify the Windows CLI image pipeline
        if: runner.os == 'Linux'
        run: |
          docker buildx create --name radius-windows-smoke --driver docker-container --use
          bun scripts/verify-windows-build.ts

      - name: Set up Windows Rust validation
        if: runner.os == 'Windows'
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy --component rustfmt --target x86_64-unknown-linux-musl

      - name: Build and check Windows guest programs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($guest in 'radius-vminit', 'radius-rootfs-builder') {
            Push-Location "apps/runtime-host-windows/guest/$guest"
            try {
              cargo +1.94.0 fmt --check
              if ($LASTEXITCODE -ne 0) { throw "Guest formatting failed: $guest" }
              cargo +1.94.0 clippy --locked --all-targets --all-features -- -D warnings
              if ($LASTEXITCODE -ne 0) { throw "Guest clippy failed: $guest" }
              cargo +1.94.0 build --locked --release
              if ($LASTEXITCODE -ne 0) { throw "Guest build failed: $guest" }
            } finally { Pop-Location }
          }

      - name: Validate native Windows runtime host
        if: runner.os == 'Windows'
        working-directory: apps/runtime-host-windows
        shell: pwsh
        run: |
          cargo +1.94.0 fmt --check
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime formatting failed' }
          cargo +1.94.0 clippy --locked --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime clippy failed' }
          cargo +1.94.0 test --locked
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime tests failed' }

      - name: Audit production dependencies
        if: runner.os == 'Linux'
        # GHSA-vfj7-8cjw-p6xm (braces) has no fixed release and only reaches
        # us through eslint-config-next, a dev dependency.
        run: bun audit --audit-level high --ignore=GHSA-vfj7-8cjw-p6xm
