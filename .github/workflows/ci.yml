name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sync-database-changes:
    name: Detect sync database changes
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.changes.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Test database change detection
        run: bun test scripts/ci/sync-database-changes.test.ts
      - name: Detect affected inputs
        id: changes
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_DIFF_EVENT: ${{ github.event_name }}
        run: bun scripts/ci/sync-database-changes.ts

  sync-database:
    name: PostgreSQL sync isolation and upgrades
    needs: sync-database-changes
    # Keep this check's name stable. A skipped job reports success; detector
    # failures or missing outputs instead run the real database verification.
    if: ${{ !cancelled() && (needs.sync-database-changes.result != 'success' || needs.sync-database-changes.outputs.required != 'false') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_USER: radius
          POSTGRES_PASSWORD: radius-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radius -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install database verification dependencies
        run: bun install --frozen-lockfile --ignore-scripts --filter @curve-ai/radius-platform-api --filter @curve-ai/platform-database
      - name: Verify protected sync and migration paths
        env:
          RADIUS_DATABASE_MIGRATION_URL: postgresql://radius:radius-ci-only@127.0.0.1:5432/postgres
          RADIUS_DISPOSABLE_DATABASE: "true"
        run: bun run --cwd apps/platform-api verify:sync-database

  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Install dependencies
        run: bun ci

      - name: Check formatting of changed files
        if: runner.os == 'Linux'
        shell: bash
        env:
          FORMAT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bun fmt --changed="$FORMAT_BASE" --check

      - name: Type-check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run --cwd apps/desktop build:bundle

      - name: Verify the Windows CLI image pipeline
        if: runner.os == 'Linux'
        run: |
          docker buildx create --name radius-windows-smoke --driver docker-container --use
          bun scripts/verify-windows-build.ts

      - name: Set up Windows Rust validation
        if: runner.os == 'Windows'
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy --component rustfmt --target x86_64-unknown-linux-musl

      - name: Build and check Windows guest programs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($guest in 'radius-vminit', 'radius-rootfs-builder') {
            Push-Location "apps/runtime-host-windows/guest/$guest"
            try {
              cargo +1.94.0 fmt --check
              if ($LASTEXITCODE -ne 0) { throw "Guest formatting failed: $guest" }
              cargo +1.94.0 clippy --locked --all-targets --all-features -- -D warnings
              if ($LASTEXITCODE -ne 0) { throw "Guest clippy failed: $guest" }
              cargo +1.94.0 build --locked --release
              if ($LASTEXITCODE -ne 0) { throw "Guest build failed: $guest" }
            } finally { Pop-Location }
          }

      - name: Validate native Windows runtime host
        if: runner.os == 'Windows'
        working-directory: apps/runtime-host-windows
        shell: pwsh
        run: |
          cargo +1.94.0 fmt --check
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime formatting failed' }
          cargo +1.94.0 clippy --locked --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime clippy failed' }
          cargo +1.94.0 test --locked
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime tests failed' }

      - name: Audit production dependencies
        if: runner.os == 'Linux'
        # GHSA-vfj7-8cjw-p6xm (braces) has no fixed release and only reaches
        # us through eslint-config-next, a dev dependency.
        run: bun audit --audit-level high --ignore=GHSA-vfj7-8cjw-p6xm
