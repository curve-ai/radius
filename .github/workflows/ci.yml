name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  embedded-auth:
    name: Embedded auth (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_USER: radius
          POSTGRES_PASSWORD: radius-ci-only
          POSTGRES_DB: radius_development
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radius -d radius_development"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --filter @curve-ai/radius-platform-api
      - run: bun run --cwd apps/platform-api build:auth-ui
      - run: bun test apps/platform-api/auth-ui/authorization-state.test.ts
      - run: bun apps/platform-api/scripts/verify-embedded-auth.ts
        env:
          DATABASE_URL: postgresql://radius:radius-ci-only@127.0.0.1:5432/radius_development

  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Install dependencies
        run: bun ci

      - name: Type-check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run --cwd apps/desktop build:bundle

      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: bun audit --audit-level high
