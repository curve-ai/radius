version: 2
updates:
  # bun.lock at the root covers every workspace, so one entry is enough.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
  # Workflows pin actions to commit SHAs; this keeps those pins current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
