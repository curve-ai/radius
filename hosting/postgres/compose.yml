name: radius-platform-postgres

services:
  postgres:
    build:
      context: .
      dockerfile: Containerfile
    image: curve-ai/radius-postgres:18.6
    restart: unless-stopped
    env_file:
      - ${RADIUS_POSTGRES_ENV_FILE:-./postgres.env}
    ports:
      - "127.0.0.1:${RADIUS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - radius-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  radius-postgres-data:
