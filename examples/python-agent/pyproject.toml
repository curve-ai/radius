[project]
name = "radius-python-example"
version = "0.0.1"
requires-python = ">=3.12,<3.15"
dependencies = ["agent-client-protocol==0.12.1"]


[tool.radius]
schemaVersion = 1
agent = "agent_python1"
name = "Python Example Agent"
capabilities = []
networkAllowlist = []

[tool.radius.runtime]
kind = "python"
module = "radius_python_agent.agent"
python = "3.12"
lockfile = "uv.lock"

[tool.radius.resources]
cpu = 2
memoryMb = 4096
diskMb = 5120

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.1.0", "ruff==0.12.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
cache_dir = ".pytest_cache"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = ".ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
