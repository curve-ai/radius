[package]
name = "radius-rootfs-builder"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false
description = "Runs inside the short-lived builder VM of the Radius Windows runtime host: turns an agent image's layers into its read-only erofs code disk."

[dependencies]
am-fs-erofs = "=0.1.5"
flate2 = "=1.1.10"
libc = "=0.2.184"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.143"
tar = { version = "=0.4.46", default-features = false }

[profile.release]
panic = "abort"
strip = true
lto = true
opt-level = "s"
